<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <style>
    :root { --ink: #1b1b1b; --muted: #595959; --line: #d0d0d0; --accent: #1f4e8c; --card: #f6f6f6; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: var(--ink); background: #fff; }
    header, main, footer { max-width: 44rem; margin: 0 auto; padding: 0.75rem 1rem; }
    header { border-bottom: 1px solid var(--line); font-weight: 600; }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }
    h1 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.75rem;
             list-style: none; padding: 0; margin: 0 0 1rem; }
    .stats a { display: block; height: 100%; padding: 0.75rem; border: 1px solid var(--line);
               border-radius: 0.5rem; background: var(--card); text-decoration: none; color: var(--ink); }
    .stats .count { display: block; font-size: 2rem; font-weight: 700; line-height: 1.1; }
    .stats .label { color: var(--muted); }
    .notice { padding: 0.75rem 1rem; border-left: 4px solid var(--accent); background: var(--card); }
    .filters { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; margin: 0 0 1rem; }
    .filters ul { display: flex; flex-wrap: wrap; gap: 0.25rem; list-style: none; padding: 0; margin: 0; }
    .filters a { display: inline-block; min-height: 2.75rem; padding: 0.5rem 0.75rem; border: 1px solid var(--line);
                 border-radius: 0.5rem; text-decoration: none; }
    .filters a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .content-rows { list-style: none; padding: 0; margin: 0; }
    .content-row { padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
    .row-title { font-weight: 600; overflow-wrap: anywhere; }
    .row-meta { display: flex; flex-wrap: wrap; gap: 0 0.75rem; color: var(--muted); font-size: 0.9rem; }
    button { min-height: 2.75rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <header><a href="{{ home_path | default('index.html') }}">{{ title }}</a></header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
