<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
  <header>
    <a class="site-name" href="{{ root }}index.html">{{ site_title }}</a>
    <nav aria-label="Main">
      <a href="{{ root }}announcements.html">Announcements</a>
      {% for nav_page in nav_pages %}<a href="{{ root }}{{ nav_page.slug }}.html">{{ nav_page.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
