<article class="card">
  <h2 class="card-title"><a href="{{ root }}posts/{{ post.slug }}.html">{{ post.title }}</a></h2>
  <p class="meta">
    Posted <time datetime="{{ post.posted_iso }}">{{ post.posted_label }}</time>
    by {{ post.author_name }}{% if post.updated_iso %}
    · Updated <time datetime="{{ post.updated_iso }}">{{ post.updated_label }}</time>{% endif %}
  </p>
</article>
