<article class="card">
  <p class="card-dates">
    <span class="chip">Posted</span> <time datetime="{{ post.posted_iso }}">{{ post.posted_label }}</time>{% if post.updated_iso %}
    <span class="chip chip-updated">Updated</span> <time datetime="{{ post.updated_iso }}">{{ post.updated_label }}</time>{% endif %}
  </p>
  <h{{ card_level|default(2) }} class="card-title"><a href="{{ root }}posts/{{ post.slug }}.html">{{ post.title }}</a></h{{ card_level|default(2) }}>
  <p class="byline">By {{ post.author_name }}</p>
  {% if post.excerpt %}<p class="excerpt">{{ post.excerpt }}</p>{% endif %}
  <p class="card-more" aria-hidden="true">Read the announcement &rarr;</p>
</article>
